<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50"/>
      <stop offset="100%" style="stop-color:#388E3C"/>
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- 大脑图标 -->
  <g transform="translate(106, 106)">
    <path d="M150 0 C 200 -10, 250 20, 270 60 C 290 100, 280 150, 260 180 C 280 200, 285 240, 270 270 C 250 300, 210 310, 170 300 C 150 310, 120 300, 100 280 C 60 260, 40 220, 50 170 C 30 140, 40 90, 70 60 C 90 30, 120 10, 150 0 Z" fill="white" opacity="0.95"/>
    <ellipse cx="150" cy="150" rx="100" ry="120" fill="white" opacity="0.9"/>
    
    <!-- 褶皱线 -->
    <path d="M80 100 Q 120 150, 80 200" stroke="#4CAF50" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M120 80 Q 160 130, 120 180" stroke="#4CAF50" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M160 90 Q 200 140, 160 190" stroke="#4CAF50" stroke-width="6" fill="none" stroke-linecap="round"/>
    
    <!-- 中心曲线 -->
    <path d="M100 150 Q 150 130, 200 150 Q 150 170, 100 150" stroke="#388E3C" stroke-width="4" fill="none"/>
  </g>
  
  <!-- 右上角星星 -->
  <text x="420" y="80" font-size="60" fill="#FFEB3B">⭐</text>
  
  <!-- 左下角书本 -->
  <text x="40" y="480" font-size="50" fill="white" opacity="0.8">📚</text>
</svg>
